services:
  vllm:
    build: .
    image: vllm-openai-turboquant
    ipc: host
    gpus: all
    ports:
      - "${VLLM_PORT:-8000}:8000"
    volumes:
      - hf-cache:/root/.cache/huggingface
    environment:
      HF_TOKEN: "${HF_TOKEN:-}"
      TQ4_K_BITS: "${TQ4_K_BITS:-4}"
      TQ4_V_BITS: "${TQ4_V_BITS:-4}"
      TQ4_USE_FUSED_PAGED: "${TQ4_USE_FUSED_PAGED:-0}"
      TQ4_USE_INT8_PREFILL: "${TQ4_USE_INT8_PREFILL:-0}"
    command:
      - "${MODEL_ID:-facebook/opt-125m}"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8000"
      - "--dtype"
      - "${VLLM_DTYPE:-half}"
      - "--max-model-len"
      - "${MAX_MODEL_LEN:-128}"
      - "--gpu-memory-utilization"
      - "${GPU_MEMORY_UTILIZATION:-0.6}"
      - "--attention-backend"
      - "CUSTOM"

volumes:
  hf-cache:
